name: ForgeAI Live Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-smoke.yml"
      - "apps/api/**"
      - "apps/web/**"
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render API
        shell: bash
        run: |
          set -euo pipefail
          url="https://forgeai-api-ok42.onrender.com/health"
          for attempt in $(seq 1 24); do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $attempt: health returned $code"
            sleep 10
          done
          echo "API health never reached 200"
          exit 1

      - name: Check readiness
        run: |
          curl --fail --show-error --silent             https://forgeai-api-ok42.onrender.com/ready             | tee /tmp/ready.json

      - name: Run live seed benchmark
        shell: bash
        run: |
          set -euo pipefail
          url="https://forgeai-api-ok42.onrender.com/api/v1/evaluation/seed"
          success=0

          for attempt in $(seq 1 24); do
            code=$(curl -sS -o /tmp/benchmark.json -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ]; then
              success=1
              break
            fi
            echo "Attempt $attempt: benchmark returned $code"
            cat /tmp/benchmark.json || true
            sleep 10
          done

          if [ "$success" != "1" ]; then
            echo "Live benchmark never reached 200"
            exit 1
          fi

          cat /tmp/benchmark.json
          python - <<'PY'
          import json
          with open('/tmp/benchmark.json') as f:
              data = json.load(f)

          m = data['metrics']
          print(f"Top-1 accuracy: {m['top1_accuracy']:.4f}")
          print(f"Top-3 recall: {m['topk_recall']:.4f}")
          print(f"MRR: {m['mean_reciprocal_rank']:.4f}")
          print(f"Symbol accuracy: {m['symbol_accuracy']}")
          print(f"Average latency ms: {m['average_latency_ms']}")
          assert m['cases'] >= 3
          PY

      - name: Check live Generate Plan
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent             -X POST             -H "Content-Type: application/json"             -d '{"repository_url":"https://github.com/laksh150806/ForgeAI","task":"Find the code responsible for GitHub repository URL validation.","generate_patch":true}'             https://forgeai-api-ok42.onrender.com/api/v1/plans/generate             | tee /tmp/plan.json
          python - <<'PY'
          import json
          with open('/tmp/plan.json') as f:
              data = json.load(f)
          assert data["repository"] == "laksh150806/ForgeAI"
          assert data["plan"]["target_files"]
          assert data["patch_status"] in {
              "generated",
              "model_unavailable",
              "model_output_rejected",
              "insufficient_evidence",
          }
          print("Generate Plan live smoke: OK")
          PY

      - name: Check live incident correlation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"repository_url":"https://github.com/laksh150806/ForgeAI","incident":"Production incident correlation fails while inspecting recent changes.","evidence":{"error_message":"Failure in apps/api/app/services/incident_correlation.py while correlating a deploy."},"lookback_commits":20,"code_limit":6}' \
            https://forgeai-api-ok42.onrender.com/api/v1/incidents/correlate \
            | tee /tmp/incident.json

          python - <<'PY'
          import json
          with open('/tmp/incident.json') as f:
              data = json.load(f)
          assert data["repository"] == "laksh150806/ForgeAI"
          assert data["correlation_mode"] == "git-history+runtime-evidence+code-retrieval"
          assert data["candidates"]
          assert data["investigation"]["evidence"]
          assert data["investigation"]["hypothesis"]["summary"]
          print("Incident correlation live smoke: OK")
          PY

      - name: Check live trace history
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --show-error --silent             -X POST             -H "Content-Type: application/json"             -d '{"repository_url":"https://github.com/laksh150806/ForgeAI","task":"Find the code responsible for GitHub repository URL validation.","generate_patch":false,"validate_patch":false}'             https://forgeai-api-ok42.onrender.com/api/v1/runs/execute             | tee /tmp/run.json

          run_id=$(python - <<'PY'
          import json
          with open('/tmp/run.json') as f:
              data = json.load(f)
          assert data["status"] in {"completed", "blocked"}
          assert data["stages"]
          print(data["run_id"])
          PY
          )

          curl --fail --show-error --silent             "https://forgeai-api-ok42.onrender.com/api/v1/runs/recent?limit=8"             | tee /tmp/recent.json

          RUN_ID="$run_id" python - <<'PY'
          import json, os
          with open('/tmp/recent.json') as f:
              rows = json.load(f)
          assert any(row["run_id"] == os.environ["RUN_ID"] for row in rows)
          PY

          curl --fail --show-error --silent             "https://forgeai-api-ok42.onrender.com/api/v1/runs/$run_id"             | tee /tmp/run-detail.json

          RUN_ID="$run_id" python - <<'PY'
          import json, os
          with open('/tmp/run-detail.json') as f:
              data = json.load(f)
          assert data["run_id"] == os.environ["RUN_ID"]
          assert data["metrics"]["stages_completed"] >= 1
          print("Trace history live smoke: OK")
          PY

      - name: Check live web
        run: |
          curl --fail --show-error --silent             https://forgeai-web-irot.onrender.com             | grep -q "ForgeAI"
