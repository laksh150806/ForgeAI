name: ForgeAI Live Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-smoke.yml"
      - "apps/api/**"
      - "apps/web/**"
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render API
        shell: bash
        run: |
          set -euo pipefail
          url="https://forgeai-api-ok42.onrender.com/health"
          for attempt in $(seq 1 24); do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $attempt: health returned $code"
            sleep 10
          done
          echo "API health never reached 200"
          exit 1

      - name: Check readiness
        run: |
          curl --fail --show-error --silent             https://forgeai-api-ok42.onrender.com/ready             | tee /tmp/ready.json

      - name: Run live seed benchmark
        shell: bash
        run: |
          set -euo pipefail
          url="https://forgeai-api-ok42.onrender.com/api/v1/evaluation/seed"
          success=0

          for attempt in $(seq 1 24); do
            code=$(curl -sS -o /tmp/benchmark.json -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ]; then
              success=1
              break
            fi
            echo "Attempt $attempt: benchmark returned $code"
            cat /tmp/benchmark.json || true
            sleep 10
          done

          if [ "$success" != "1" ]; then
            echo "Live benchmark never reached 200"
            exit 1
          fi

          cat /tmp/benchmark.json
          python - <<'PY'
          import json
          with open('/tmp/benchmark.json') as f:
              data = json.load(f)

          m = data['metrics']
          print(f"Top-1 accuracy: {m['top1_accuracy']:.4f}")
          print(f"Top-3 recall: {m['topk_recall']:.4f}")
          print(f"MRR: {m['mean_reciprocal_rank']:.4f}")
          print(f"Symbol accuracy: {m['symbol_accuracy']}")
          print(f"Average latency ms: {m['average_latency_ms']}")
          assert m['cases'] >= 3
          PY

      - name: Check live Generate Plan
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent             -X POST             -H "Content-Type: application/json"             -d '{"repository_url":"https://github.com/laksh150806/ForgeAI","task":"Find the code responsible for GitHub repository URL validation.","generate_patch":true}'             https://forgeai-api-ok42.onrender.com/api/v1/plans/generate             | tee /tmp/plan.json
          python - <<'PY'
          import json
          with open('/tmp/plan.json') as f:
              data = json.load(f)
          assert data["repository"] == "laksh150806/ForgeAI"
          assert data["plan"]["target_files"]
          assert data["patch_status"] in {
              "generated",
              "model_unavailable",
              "model_output_rejected",
              "insufficient_evidence",
          }
          print("Generate Plan live smoke: OK")
          PY

      - name: Check live incident correlation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"repository_url":"https://github.com/laksh150806/ForgeAI","incident":"Production incident correlation fails while inspecting recent changes.","evidence":{"error_message":"Failure in apps/api/app/services/incident_correlation.py while correlating a deploy."},"lookback_commits":20,"code_limit":6}' \
            https://forgeai-api-ok42.onrender.com/api/v1/incidents/correlate \
            | tee /tmp/incident.json

          python - <<'PY'
          import json
          with open('/tmp/incident.json') as f:
              data = json.load(f)
          assert data["repository"] == "laksh150806/ForgeAI"
          assert data["correlation_mode"] == "git-history+runtime-evidence+code-retrieval"
          assert data["candidates"]
          assert data["investigation"]["evidence"]
          assert data["investigation"]["hypothesis"]["summary"]
          print("Incident correlation live smoke: OK")
          PY

      - name: Check live telemetry timeline
        shell: bash
        run: |
          set -euo pipefail

          deploy_time=$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          warn_time=$(date -u -d '2 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          error_time=$(date -u -d '1 minute ago' +%Y-%m-%dT%H:%M:%SZ)

          cat > /tmp/telemetry.json <<JSON
          {
            "events": [
              {
                "observed_at": "$deploy_time",
                "source": "github-actions-smoke",
                "event_type": "deploy",
                "severity": "info",
                "service": "forgeai-smoke",
                "message": "Production deploy completed",
                "deploy_sha": "1e1df3a5de27e15afbfe8aae1173ff402ca9194a",
                "metadata": {"environment": "production"}
              },
              {
                "observed_at": "$warn_time",
                "source": "github-actions-smoke",
                "event_type": "log",
                "severity": "warning",
                "service": "forgeai-smoke",
                "message": "Telemetry timeline latency increased after deploy",
                "metadata": {}
              },
              {
                "observed_at": "$error_time",
                "source": "github-actions-smoke",
                "event_type": "error",
                "severity": "error",
                "service": "forgeai-smoke",
                "message": "Failure in apps/api/app/services/telemetry_timeline.py reconstruct_timeline",
                "metadata": {}
              }
            ]
          }
          JSON

          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/telemetry.json \
            https://forgeai-api-ok42.onrender.com/api/v1/telemetry/events \
            | tee /tmp/telemetry-ingest.json

          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"repository_url":"https://github.com/laksh150806/ForgeAI","service":"forgeai-smoke","lookback_minutes":30,"max_events":100,"lookback_commits":20,"code_limit":6}' \
            https://forgeai-api-ok42.onrender.com/api/v1/telemetry/timeline \
            | tee /tmp/telemetry-timeline.json

          python - <<'PY'
          import json
          with open('/tmp/telemetry-ingest.json') as f:
              ingest = json.load(f)
          with open('/tmp/telemetry-timeline.json') as f:
              timeline = json.load(f)
          assert ingest["accepted"] == 3
          assert ingest["storage"] in {"postgres", "memory"}
          assert timeline["first_failure_at"]
          assert timeline["nearest_deploy"]
          assert timeline["nearest_deploy"]["deploy_sha"].startswith("1e1df3a5")
          assert timeline["correlation"]
          assert timeline["correlation"]["candidates"]
          print("Telemetry timeline live smoke: OK")
          PY

      - name: Check live Render adapter sync
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --show-error --silent \
            https://forgeai-api-ok42.onrender.com/api/v1/integrations/render/status \
            | tee /tmp/render-status.json

          python - <<'PY'
          import json
          with open('/tmp/render-status.json') as f:
              data = json.load(f)
          assert data["configured"] is True
          assert data["api_key_configured"] is True
          assert data["service_id"] == "srv-db1qoj49v7es738q3u5g"
          print("Render adapter status: configured")
          PY

          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"repository_url":"https://github.com/laksh150806/ForgeAI","lookback_minutes":60,"log_limit":100,"deploy_limit":20,"reconstruct_timeline":true}' \
            https://forgeai-api-ok42.onrender.com/api/v1/integrations/render/sync \
            | tee /tmp/render-sync.json

          python - <<'PY'
          import json
          with open('/tmp/render-sync.json') as f:
              data = json.load(f)
          assert data["service_id"] == "srv-db1qoj49v7es738q3u5g"
          assert data["accepted_events"] >= 1
          assert data["storage"] in {"postgres", "memory"}
          print(
              "Render sync:",
              data["deploy_events"],
              "deploy events,",
              data["log_events"],
              "log events,",
              data["accepted_events"],
              "accepted",
          )
          PY

      - name: Check live trace history
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --show-error --silent             -X POST             -H "Content-Type: application/json"             -d '{"repository_url":"https://github.com/laksh150806/ForgeAI","task":"Find the code responsible for GitHub repository URL validation.","generate_patch":false,"validate_patch":false}'             https://forgeai-api-ok42.onrender.com/api/v1/runs/execute             | tee /tmp/run.json

          run_id=$(python - <<'PY'
          import json
          with open('/tmp/run.json') as f:
              data = json.load(f)
          assert data["status"] in {"completed", "blocked"}
          assert data["stages"]
          print(data["run_id"])
          PY
          )

          curl --fail --show-error --silent             "https://forgeai-api-ok42.onrender.com/api/v1/runs/recent?limit=8"             | tee /tmp/recent.json

          RUN_ID="$run_id" python - <<'PY'
          import json, os
          with open('/tmp/recent.json') as f:
              rows = json.load(f)
          assert any(row["run_id"] == os.environ["RUN_ID"] for row in rows)
          PY

          curl --fail --show-error --silent             "https://forgeai-api-ok42.onrender.com/api/v1/runs/$run_id"             | tee /tmp/run-detail.json

          RUN_ID="$run_id" python - <<'PY'
          import json, os
          with open('/tmp/run-detail.json') as f:
              data = json.load(f)
          assert data["run_id"] == os.environ["RUN_ID"]
          assert data["metrics"]["stages_completed"] >= 1
          print("Trace history live smoke: OK")
          PY

      - name: Check live web
        run: |
          curl --fail --show-error --silent             https://forgeai-web-irot.onrender.com             | grep -q "ForgeAI"
