name: ForgeAI GitHub Runtime Read-only Smoke

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/github-runtime-smoke.yml"
  workflow_dispatch:

jobs:
  github-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live status and bounded GitHub polling without database writes
        shell: bash
        run: |
          set -euo pipefail
          url="https://forgeai-api-ok42.onrender.com"
          ready=0
          for attempt in $(seq 1 24); do
            code=$(curl -sS -o /tmp/github-runtime-status.json -w "%{http_code}" \
              "$url/api/v1/integrations/github-runtime/status" || true)
            if [ "$code" = "200" ]; then
              ready=1
              break
            fi
            echo "Attempt $attempt: GitHub runtime adapter status HTTP $code"
            sleep 10
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/github-runtime-status.json || true
            exit 1
          fi
          python - <<'PY'
          import json
          with open("/tmp/github-runtime-status.json") as f:
              data = json.load(f)
          assert isinstance(data["token_configured"], bool)
          assert data["public_repository_reads"] is True
          assert data["ingestion_mode"] == "deployments+actions-summary"
          print("Live GitHub runtime status: OK")
          PY

          code=$(curl -sS -o /tmp/github-runtime-dry-run.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d '{"repository_url":"https://github.com/laksh150806/ForgeAI","service":"forgeai-github-smoke","lookback_minutes":10080,"deployment_limit":1,"workflow_limit":2,"failed_job_limit":0,"reconstruct_timeline":false,"dry_run":true}' \
            "$url/api/v1/integrations/github-runtime/sync" || true)
          if [ "$code" != "200" ]; then
            echo "Bounded read-only GitHub sync returned HTTP $code"
            cat /tmp/github-runtime-dry-run.json || true
            exit 1
          fi
          python - <<'PY'
          import json
          with open("/tmp/github-runtime-dry-run.json") as f:
              data = json.load(f)
          assert data["repository"] == "laksh150806/ForgeAI"
          assert data["branch"] == "main"
          assert data["workflow_events"] >= 1
          assert data["accepted_events"] == 0
          assert data["storage"] == "dry-run"
          assert data["timeline"] is None
          print("Live GitHub polling and normalization: OK (no DB writes)")
          PY
